spring:
  application:
    name: user-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  datasource:
    url: jdbc:postgresql://${USER_DB_HOST:localhost}:${USER_DB_PORT:5434}/${USER_DB_NAME:dobrovichek_user}
    username: ${USER_DB_USERNAME:dobrovichek}
    password: ${USER_DB_PASSWORD:dobrovichek}
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match:
    - /api/v1/**

server:
  port: 8082

dobrovichek:
  public-api-url: ${PUBLIC_API_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-in-production-min-32-chars!!}
    issuer: ${JWT_ISSUER:dobrovichek}
    access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:PT24H}
  volunteer:
    abandonment-rating-multiplier: ${ABANDONMENT_RATING_MULTIPLIER:0.8}
  messaging:
    enabled: true
  internal-api-token: ${INTERNAL_API_TOKEN:}
  request-service:
    base-url: ${REQUEST_SERVICE_BASE_URL:http://localhost:8083}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
