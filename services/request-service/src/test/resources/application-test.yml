spring:
  datasource:
    url: jdbc:h2:mem:request-service-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml

dobrovichek:
  jwt:
    secret: test-test-test-test-test-test-test-test-32bytes!
    issuer: dobrovichek
    access-token-validity: PT1H
  messaging:
    enabled: false
