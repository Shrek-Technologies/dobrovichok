spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://${USER_DB_HOST:localhost}:${USER_DB_PORT:5434}/${USER_DB_NAME:dobrovichek_user}
    username: ${USER_DB_USERNAME:dobrovichek}
    password: ${USER_DB_PASSWORD:dobrovichek}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8081
  address: 0.0.0.0
