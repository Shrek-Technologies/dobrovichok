spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: swagger-proxy-identity
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/swagger-proxy/identity/**
          filters:
            - RewritePath=/swagger-proxy/identity/(?<path>.*), /$\{path}
        - id: swagger-proxy-user
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/swagger-proxy/user/**
          filters:
            - RewritePath=/swagger-proxy/user/(?<path>.*), /$\{path}
        - id: swagger-proxy-request
          uri: ${REQUEST_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/swagger-proxy/request/**
          filters:
            - RewritePath=/swagger-proxy/request/(?<path>.*), /$\{path}
        - id: identity-auth
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: request-api
          uri: ${REQUEST_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/requests/**
        - id: user-api
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/users/**,/api/v1/volunteers/**

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    disable-swagger-default-url: true
    urls:
      - name: Identity
        url: /swagger-proxy/identity/v3/api-docs
      - name: User
        url: /swagger-proxy/user/v3/api-docs
      - name: Request
        url: /swagger-proxy/request/v3/api-docs
    urls-primary-name: Identity

dobrovichek:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-in-production-min-32-chars!!}
    issuer: ${JWT_ISSUER:dobrovichek}
    access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:PT24H}

server:
  port: 8080
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info
